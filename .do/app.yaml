name: aaji-pill-clerk
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    envs:
      - key: PARSER_BACKEND
        value: tinker
      - key: LLM_BACKEND
        value: digitalocean
      - key: EXTRACT_BACKEND
        value: hosted
      - key: TINKER_API_KEY
        type: SECRET
      - key: DO_MODEL_ACCESS_KEY
        type: SECRET
      - key: PILLCLERK_TINKER_PATH
        type: SECRET
