[theme]
primaryColor = "#0369A1"
backgroundColor = "#F0F9FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0C4A6E"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Hosted Tinker needs tokenizers, not vision models. Watching lazy imports in
# transformers probes optional torchvision modules and stalls page transitions.
fileWatcherType = "none"
