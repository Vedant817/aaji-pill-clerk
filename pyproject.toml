[project]
name = "pill-clerk"
version = "0.1.0"
description = "Turn photos of handwritten prescriptions into a confirmed medicine schedule, fridge chart, and calendar reminders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vedant" }]
dependencies = [
    "tinker==0.31.0",
    "ollama==0.6.3",
    "openai==3.23.0",
    "pydantic==2.13.5",
    "streamlit==1.64.0",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "icalendar==7.3.0",
    "httpx==0.28.1",
    "rapidfuzz==3.14.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# tinker-cookbook 0.5.7 depends on tml-renderers, which has no Windows wheel
# (manylinux + macosx only). Install on WSL/Linux when running SFT:
#   uv sync --extra train --group dev
train = [
    "tinker-cookbook==0.5.7",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pillclerk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
